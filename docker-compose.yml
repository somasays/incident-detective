name: incident-detective
services:
  neo4j:
    image: neo4j:2026.10.0
    container_name: incident-detective-neo4j
    entrypoint: ["tini", "-g", "--", "/bin/bash", "/incident-detective/start_neo4j.sh"]
    command: ["neo4j"]
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_server_bolt_advertised__address: localhost:7687
      NEO4J_server_http_advertised__address: localhost:7474
      NEO4J_dbms_usage__report_enabled: "false"
      NEO4J_dbms_fleet__manager_enabled: "false"
      NEO4J_server_fleet__discovery_enabled: "false"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.meta.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.meta.*"
    volumes:
      - ./scripts/start_neo4j.sh:/incident-detective/start_neo4j.sh:ro
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
    restart: unless-stopped
volumes:
  neo4j_data:
  neo4j_logs:
